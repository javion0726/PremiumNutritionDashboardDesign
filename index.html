
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
      <title>Ascend Fitness Mobile App</title>
      <meta name="description" content="Track workouts, nutrition, and progress with a sleek interface designed for fitness enthusiasts seeking a calm, data-driven wellness experience." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" href="/favicon-32.png" sizes="32x32" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#F6F5F2" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Ascend" />
      <style>
        html, body { height: 100%; margin: 0; } #root { height: 100%; }
        /* Portrait-only: iOS Safari never implemented the Screen Orientation
           Lock API (even for installed PWAs), so a pure-CSS blocker is the
           only approach that works reliably across every platform. */
        #landscape-blocker { display: none; }
        @media (orientation: landscape) {
          #root { display: none; }
          #landscape-blocker {
            display: flex; position: fixed; inset: 0; z-index: 9999;
            background: #F6F5F2; color: #1A1917;
            align-items: center; justify-content: center; text-align: center;
            flex-direction: column; padding: 32px; box-sizing: border-box;
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
          }
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <div id="landscape-blocker">
        <div style="font-size:40px;margin-bottom:16px;">📱</div>
        <p style="font-size:17px;font-weight:700;margin:0 0 6px;">Please rotate your device</p>
        <p style="font-size:14px;color:#918D88;margin:0;">Ascend is designed for portrait mode.</p>
      </div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
