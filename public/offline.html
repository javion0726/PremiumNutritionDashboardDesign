<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascend — Offline</title>
  <style>
    html, body {
      height: 100%; margin: 0;
      background: #F6F5F2;
      color: #1A1917;
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 32px; box-sizing: border-box;
    }
    .icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: #EDECEA; display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; font-size: 28px;
    }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
    p { font-size: 14px; color: #918D88; margin: 0 0 24px; line-height: 1.6; max-width: 280px; }
    button {
      background: #1F5C3A; color: #fff; border: none; border-radius: 12px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Ascend needs a connection for this page. Your logged workouts and meals are saved on this device and will sync once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
