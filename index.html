
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
      <title>Ascend Fitness Mobile App</title>
      <meta name="description" content="Track workouts, nutrition, and progress with a sleek interface designed for fitness enthusiasts seeking a calm, data-driven wellness experience." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" href="/favicon-32.png" sizes="32x32" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#F6F5F2" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Ascend" />
      <style>
        html, body { height: 100%; margin: 0; } #root { height: 100%; }
        /* Portrait lock — visually. iOS Safari never implemented the Screen
           Orientation Lock API (even for installed PWAs), so this rotates
           the whole page back to portrait via CSS when a real touch device
           is turned sideways, instead of showing a blocking message.

           Scoped to (hover: none) and (pointer: coarse) — genuine touch
           devices only. Without this, "orientation: landscape" alone also
           matches any wide desktop browser window and would incorrectly
           rotate/hide the app there too. */
        @media screen and (orientation: landscape) and (hover: none) and (pointer: coarse) {
          html {
            transform: rotate(-90deg);
            transform-origin: left top;
            width: 100vh;
            overflow-x: hidden;
            position: absolute;
            top: 100%;
            left: 0;
          }
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
