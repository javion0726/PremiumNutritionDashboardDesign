[build]
  command = "pnpm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @mux/mux-node's package.json has export conditions that esbuild's
  # automatic dependency bundling doesn't resolve correctly in Netlify's
  # function runtime — this was discovered the hard way with the "stripe"
  # package (since removed, along with the subscription/paywall feature it
  # supported), and applied proactively here for @mux/mux-node before ever
  # hitting the same "Cannot find package" error in production.
  external_node_modules = ["@mux/mux-node"]

# The service worker must never be long-cached, or users get stuck on old builds.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Vite's hashed assets are immutable by construction.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
